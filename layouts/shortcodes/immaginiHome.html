<style>
    #gallery-home {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 15px;
    }
    
    #gallery-home a {
        overflow: hidden;
        border-radius: 8px;
    }
    
    #gallery-home img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.3s ease;
    }
    
    #gallery-home a:hover img {
        transform: scale(1.05);
    }
</style>

<script type="module">
    import Lightbox from 'https://raw.githubusercontent.com/dimsemenov/PhotoSwipe/refs/heads/master/dist/photoswipe-lightbox.esm.js';
    const lightbox = new Lightbox({
        gallery: '#gallery-home',
        children: 'a',
        pswpModule: () => import('https://raw.githubusercontent.com/dimsemenov/PhotoSwipe/refs/heads/master/dist/photoswipe.esm.js')
    });
    lightbox.init();
</script>
