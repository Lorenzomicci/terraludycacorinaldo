<style>
    #gallery--getting-started {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 15px;
    }
    
    #gallery--getting-started a {
        overflow: hidden;
        border-radius: 8px;
    }
    
    #gallery--getting-started img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.3s ease;
    }
    
    #gallery--getting-started a:hover img {
        transform: scale(1.05);
    }
</style>

<script type="module">
    import Lightbox from 'https://raw.githubusercontent.com/dimsemenov/PhotoSwipe/refs/heads/master/dist/photoswipe-lightbox.esm.js';
    const lightbox = new Lightbox({
        gallery: '#gallery--getting-started',
        children: 'a',
        pswpModule: () => import('https://raw.githubusercontent.com/dimsemenov/PhotoSwipe/refs/heads/master/dist/photoswipe.esm.js')
    });
    lightbox.init();
</script>
