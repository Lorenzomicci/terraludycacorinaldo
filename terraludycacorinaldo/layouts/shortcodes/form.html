

<div class="signup-container">
    <h3>Iscriviti</h3>

    <form id="signupForm-{{ now.Unix }}" onsubmit="handleSubmit(event, '{{ now.Unix }}')">
        <div class="form-group">
            <label for="gameSelect-{{ now.Unix }}">Gioco:</label>
            <select id="gameSelect-{{ now.Unix }}" name="game" required>
                <option value="">-- Scegli un gioco --</option>
                <option value="cc">Commands and Colors Medieval</option>
                <option value="ff">Fighting Formations</option>
                <option value="in">Indonesia</option>
            </select>
        </div>

        <div class="form-group">
            <label for="nameInput-{{ now.Unix }}">Nome/Nickname:</label>
            <input 
                type="text" 
                id="nameInput-{{ now.Unix }}" 
                name="name" 
                placeholder="Inserisci il tuo nome"
                required
            />
        </div>

        <div class="form-group">
            <button type="submit" id="submitBtn-{{ now.Unix }}">Iscriviti</button>
            <div class="status-message" id="statusMsg-{{ now.Unix }}"></div>
        </div>
    </form>

    <div class="registrations-section">
        <h4>Iscritti:</h4>
        <div id="registrationsList-{{ now.Unix }}"></div>
    </div>
</div>

<script>
    const gameNames = {
        'cc': 'Commands and Colors Medieval',
        'ff': 'Fighting Formations',
        'in': 'Indonesia'
    };

    async function handleSubmit(event, id) {
        event.preventDefault();

        const gameSelect = document.getElementById(`gameSelect-${id}`);
        const nameInput = document.getElementById(`nameInput-${id}`);
        const submitBtn = document.getElementById(`submitBtn-${id}`);
        const statusMsg = document.getElementById(`statusMsg-${id}`);
        
        const game = gameSelect.value;
        const name = nameInput.value.trim();

        if (!game || !name) {
            showStatus(statusMsg, 'Compila tutti i campi!', 'error');
            return;
        }

        const registration = {
            game: game,
            name: name,
            timestamp: new Date().toISOString()
        };

        submitBtn.disabled = true;
        submitBtn.textContent = 'Salvataggio...';

        try {
            const response = await fetch('/api/signup', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(registration)
            });

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            showStatus(statusMsg, 'Iscritto con successo!', 'success');
            gameSelect.value = '';
            nameInput.value = '';
            
            setTimeout(() => {
                loadAndRenderRegistrations(id);
            }, 500);

        } catch (error) {
            console.error('Errore:', error);
            showStatus(statusMsg, 'Errore nel salvataggio. Riprova.', 'error');
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Iscriviti';
            nameInput.focus();
        }
    }

    async function loadAndRenderRegistrations(id) {
        try {
            const response = await fetch('/api/signups');
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            
            const registrations = await response.json();
            renderRegistrations(id, registrations);
        } catch (error) {
            console.error('Errore nel caricamento:', error);
            renderRegistrations(id, []);
        }
    }

    function renderRegistrations(id, registrations) {
        const container = document.getElementById(`registrationsList-${id}`);

        if (!registrations || registrations.length === 0) {
            container.innerHTML = '<div class="empty-registrations">Nessuna iscrizione ancora</div>';
            return;
        }

        container.innerHTML = registrations.map((reg, index) => `
            <div class="registration-item">
                <div class="registration-info">
                    <div class="registration-name">${escapeHtml(reg.name)}</div>
                    <div class="registration-game">${gameNames[reg.game] || reg.game}</div>
                </div>
                <button class="registration-delete" onclick="deleteRegistration('${id}', '${reg.id || index}')">Elimina</button>
            </div>
        `).join('');
    }

    async function deleteRegistration(id, registrationId) {
        if (!confirm('Elimina questa iscrizione?')) {
            return;
        }

        try {
            const response = await fetch(`/api/signup/${registrationId}`, {
                method: 'DELETE'
            });

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            loadAndRenderRegistrations(id);
        } catch (error) {
            console.error('Errore nell\'eliminazione:', error);
            alert('Errore nell\'eliminazione');
        }
    }

    function showStatus(element, message, type) {
        element.textContent = message;
        element.className = `status-message ${type}`;
        setTimeout(() => {
            element.className = 'status-message';
        }, 3000);
    }

    function escapeHtml(text) {
        const map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        };
        return text.replace(/[&<>"']/g, m => map[m]);
    }

    document.addEventListener('DOMContentLoaded', function() {
        loadAndRenderRegistrations('{{ now.Unix }}');
    });
</script>
