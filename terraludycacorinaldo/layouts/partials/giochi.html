<div class="bear-cub-input-wrapper">
  {{ with .label }}
    <label for="{{ $.id | default "bear-input" }}" class="bear-cub-label">
      {{ . }}
    </label>
  {{ end }}
  <input 
    type="{{ .type | default "text" }}" 
    id="{{ .id | default "bear-input" }}" 
    placeholder="{{ .placeholder | default "Search or enter text..." }}" 
    class="bear-cub-input"
  />
</div>
